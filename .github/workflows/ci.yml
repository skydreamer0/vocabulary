name: Validate vocabulary app
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      NEON_AUTH_BASE_URL: http://127.0.0.1:1/auth
      NEON_AUTH_COOKIE_SECRET: ci-only-secret-at-least-32-characters
      TEST_AUTH_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node scripts/migrate.mjs
      - run: npm run build
      - run: |
          npm start -- -p 3100 &
          npx wait-on -t 60000 http://localhost:3100/login
          BASE_URL=http://localhost:3100 npm run test:api
