name: Validate vocabulary app
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:1
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci
      TEST_AUTH_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261002000000_init.sql
      - run: npm run build
      - run: |
          npm start -- -p 3100 &
          npx wait-on -t 60000 http://localhost:3100/login
          BASE_URL=http://localhost:3100 npm run test:api
